[project]
name = "core-backend"
version = "0.1.0"
description = "Litestar API with SQLAlchemy, SAQ, and JWT auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard,jwt]>=2.15.0",
    "litestar-saq[redis]>=0.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "bcrypt>=4.2.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
